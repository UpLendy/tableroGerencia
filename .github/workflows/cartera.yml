name: Cartera desde Siigo

# A las 6:17 a. m. hora de Bogotá (11:17 UTC), casi dos horas después del
# corte. Separado a propósito: si los dos empujaran al repositorio a la vez,
# el segundo se cae por conflicto.
#
# Y va en su propio flujo porque no depende de la plataforma de formación:
# la cartera sale entera de Siigo y tiene que poder correr aunque el corte
# esté bloqueado, que es exactamente lo que pasa ahora.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      meses:
        description: "Meses hacia atrás a revisar (vacío = 24)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publica-datos
  cancel-in-progress: false

jobs:
  cartera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"

      - name: Probar
        run: npm run probar

      - name: Traer la cartera
        env:
          SIIGO_USERNAME: ${{ secrets.SIIGO_USERNAME }}
          SIIGO_ACCESS_KEY: ${{ secrets.SIIGO_ACCESS_KEY }}
          SIIGO_PARTNER_ID: ${{ secrets.SIIGO_PARTNER_ID }}
          MESES: ${{ github.event.inputs.meses }}
        run: |
          if [ -n "$MESES" ]; then
            node scripts/extraer-cartera.mjs --meses "$MESES"
          else
            node scripts/extraer-cartera.mjs
          fi

      - name: Publicar si cambió
        run: |
          if git diff --quiet -- data/cartera.json data/conciliacion.json \
             && [ -z "$(git ls-files --others --exclude-standard -- data/cartera.json data/conciliacion.json)" ]; then
            echo "La cartera no cambió. No se publica nada."
            exit 0
          fi
          git config user.name  "corte-automatico"
          git config user.email "corte-automatico@users.noreply.github.com"

          # Mismo criterio que en corte.yml: nada de rebase. La cartera se
          # regenera entera, no hay dos versiones que fusionar, y rebasar un
          # commit que toca este mismo archivo solo puede dar conflicto. Se
          # pone el archivo encima de lo último que haya en el remoto.
          cp data/cartera.json /tmp/cartera.json
          # La conciliación puede no existir: necesita un corte con algún mes
          # cerrado, y la primera vez puede no haberlo.
          cp data/conciliacion.json /tmp/conciliacion.json 2>/dev/null || true

          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cartera.json data/cartera.json
            cp /tmp/conciliacion.json data/conciliacion.json 2>/dev/null || true
            if git diff --quiet -- data/cartera.json data/conciliacion.json; then
              echo "Nada cambió respecto a lo publicado. No se publica."
              exit 0
            fi
            git add data/cartera.json data/conciliacion.json
            git commit -m "Cartera $(date -u +%Y-%m-%d)"
            # El otro flujo también empuja a main. Si publicó mientras tanto,
            # este push se cae y el ciclo vuelve a empezar sobre lo que haya
            # llegado: nunca se le pisa el trabajo.
            git push && exit 0
            echo "El remoto se movió; se reintenta sobre lo nuevo."
            sleep 5
          done
          echo "No se pudo publicar después de tres intentos"; exit 1
