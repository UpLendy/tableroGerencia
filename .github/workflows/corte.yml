name: Corte automático

# Se corre cada noche a las 04:37 hora de Bogotá (09:37 UTC).
# También se puede lanzar a mano desde Actions indicando el periodo.
on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      periodo:
        description: "Periodo a extraer, en formato YYYY-MM (vacío = mes en curso)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"

      - name: Extraer el corte desde la plataforma
        env:
          TABLERO_API_TOKEN:   ${{ secrets.TABLERO_API_TOKEN }}
          TRAMITES_API_TOKEN:  ${{ secrets.TRAMITES_API_TOKEN }}
          ALIMENTIA_API_TOKEN: ${{ secrets.ALIMENTIA_API_TOKEN }}
        run: |
          PERIODO="${{ github.event.inputs.periodo }}"
          if [ -z "$PERIODO" ]; then PERIODO=$(date -u +%Y-%m); fi
          echo "Periodo: $PERIODO"
          node scripts/extraer-corte.mjs --periodo "$PERIODO"

      # Antes de hablar con la plataforma. Si el congelamiento de meses esta
      # roto, se nota aqui y no despues de haber traido todo.
      - name: Probar el congelamiento
        run: npm run probar

      - name: Validar la coherencia del corte
        run: node scripts/validar-corte.mjs

      - name: Publicar si cambió
        run: |
          # El registro de meses cerrados entra junto con el corte. Si no se
          # commiteara, cada corrida empezaria con el registro vacio, volveria
          # a congelar los mismos meses con las cifras del dia y el
          # congelamiento no serviria para nada: lo que lo hace funcionar es
          # que el archivo sobreviva de una corrida a la siguiente.
          if git diff --quiet -- data/corte.json data/meses-cerrados.json \
             && [ -z "$(git ls-files --others --exclude-standard -- data/meses-cerrados.json)" ]; then
            echo "Ni el corte ni los meses cerrados cambiaron. No se publica nada."
            exit 0
          fi
          git config user.name  "corte-automatico"
          git config user.email "corte-automatico@users.noreply.github.com"
          git add data/corte.json data/meses-cerrados.json
          git commit -m "Corte automático $(date -u +%Y-%m-%d)"
          git push
